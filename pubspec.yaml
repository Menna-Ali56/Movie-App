name: movie_app
description: "A movies streaming Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  country_flags: ^4.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  carousel_slider: ^5.1.2
  dio: ^5.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#121212"
  image: assets/images/splash.png
  branding: assets/images/branding.png
  branding_mode: bottom

  android: true
  ios: true
  web: true

  android_12:
    color: "#121212"
    image: assets/images/splash.png
    branding: assets/images/branding.png