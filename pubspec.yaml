name: movie_app
description: "A movies streaming Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  country_flags: ^4.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  carousel_slider: ^5.1.2
  dio: ^5.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/images/
